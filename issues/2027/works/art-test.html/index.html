<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=/tempest-web/issues/2026/"><meta name="robots" content="noindex"><title>Page moved · The Tempest</title><style>
  @view-transition {
    navigation: auto;
  }
  @media (prefers-reduced-motion: reduce) {
    @view-transition {
      navigation: none;
    }
  }
</style><!-- This must run in the head before the first render, including on a cold navigation. --><script data-transition-root="/tempest-web/">(() => {
  const base = new URL(document.currentScript.dataset.transitionRoot, location.origin);
  const storageKey = `tempest-transitions:${base.pathname}`;
  const pendingKey = `${storageKey}:pending`;
  const historyKey = `${storageKey}:history`;
  const partNames = { work: ['title', 'author'], author: ['portrait', 'name'] };
  let clickedLink = null;
  let navigating = null;
  let cleanup = () => {};
  const navigation = () => Reflect.get(window, 'navigation');

  navigation()?.addEventListener('navigate', (event) => {
    navigating = event;
  });

  const localURL = (value) => {
    if (typeof value !== 'string') return null;
    try {
      const url = new URL(value, location.href);
      return url.origin === base.origin && url.pathname.startsWith(base.pathname) ? url : null;
    } catch {
      return null;
    }
  };
  const path = (value) => {
    const url = localURL(value);
    return url ? `/${url.pathname.slice(base.pathname.length)}` : null;
  };
  const slug = (value, kind) => path(value)?.match(new RegExp(`^/${kind}/([^/]+)/$`))?.[1];
  const isCardPage = (value) =>
    path(value) === '/' || /^\/issues\/\d{4}\/$/.test(path(value)) || !!slug(value, 'authors');
  const read = (key) => {
    try {
      return JSON.parse(sessionStorage.getItem(key));
    } catch {
      return null;
    }
  };
  const write = (key, value) => {
    try {
      sessionStorage.setItem(key, JSON.stringify(value));
      return true;
    } catch {
      return false;
    }
  };
  const clearPending = () => {
    try {
      sessionStorage.removeItem(pendingKey);
    } catch {}
  };
  const valid = (plan) => {
    const contexts =
      plan?.kind === 'work' ? ['card', 'detail'] : ['card', 'profile', 'byline', 'teaser'];
    return (
      plan?.version === 1 &&
      Object.hasOwn(partNames, plan.kind) &&
      typeof plan.slug === 'string' &&
      Array.isArray(plan.parts) &&
      plan.parts.length > 0 &&
      new Set(plan.parts).size === plan.parts.length &&
      plan.parts.every((part) => partNames[plan.kind].includes(part)) &&
      [plan.from, plan.to].every(
        (end) =>
          end &&
          localURL(end.url)?.href === end.url &&
          (end.key === null || typeof end.key === 'string') &&
          contexts.includes(end.context) &&
          Number.isInteger(end.index) &&
          end.index >= 0,
      )
    );
  };
  const history = () => {
    const entries = read(historyKey);
    return Array.isArray(entries) ? entries.filter(valid) : [];
  };
  const sameEntry = (end, entry) => end.key === entry.key && end.url === entry.url;
  const remember = (plan) => {
    // History entry keys distinguish repeated visits to the same issue or work.
    if (!plan.from.key || !plan.to.key) return;
    const entries = history().filter(
      (old) =>
        !(sameEntry(old.from, plan.from) && sameEntry(old.to, plan.to)) &&
        !(sameEntry(old.to, plan.from) && sameEntry(old.from, plan.to)),
    );
    write(historyKey, [...entries, plan].slice(-40));
  };
  const recalled = (from, to) => {
    if (!from.key || !to.key) return null;
    for (const plan of history().reverse()) {
      if (sameEntry(plan.from, from) && sameEntry(plan.to, to)) return plan;
      if (sameEntry(plan.to, from) && sameEntry(plan.from, to)) {
        return { ...plan, from: plan.to, to: plan.from };
      }
    }
    return null;
  };
  const route = (from, to, anchor) => {
    const fromAuthor = slug(from.url, 'authors');
    const toAuthor = slug(to.url, 'authors');
    const fromWork = slug(from.url, 'works');
    const toWork = slug(to.url, 'works');
    // A card click animates the work; an author link animates the author.
    if (
      (toAuthor && (path(from.url) === '/authors/' || fromWork)) ||
      (fromAuthor && path(to.url) === '/authors/')
    ) {
      return {
        kind: 'author',
        slug: toAuthor || fromAuthor,
        parts:
          anchor?.dataset.authorTransitionParts?.split(' ') ||
          (fromWork ? ['name'] : partNames.author),
        from: {
          ...from,
          context: fromAuthor
            ? 'profile'
            : fromWork
              ? anchor?.dataset.authorTransitionContext || 'byline'
              : 'card',
          index: 0,
        },
        to: { ...to, context: toAuthor ? 'profile' : 'card', index: 0 },
      };
    }
    if ((toWork && isCardPage(from.url)) || (fromWork && isCardPage(to.url))) {
      return {
        kind: 'work',
        slug: toWork || fromWork,
        parts: partNames.work,
        from: { ...from, context: fromWork ? 'detail' : 'card', index: 0 },
        to: { ...to, context: toWork ? 'detail' : 'card', index: 0 },
      };
    }
    return null;
  };
  const cards = (work) =>
    [...document.querySelectorAll('a[data-work-transition]')].filter(
      (element) =>
        element.dataset.workTransition === work && element.dataset.workTransitionContext === 'card',
    );
  const elements = (plan, end) => {
    const scope =
      plan.kind === 'work' && end.context === 'card' ? cards(plan.slug)[end.index] : document;
    const prefix = `${plan.kind}Transition`;
    const identity = `${prefix}${plan.kind === 'work' ? 'Work' : 'Author'}`;
    const candidates = [
      ...(scope?.querySelectorAll(`[data-${plan.kind}-transition-${plan.kind}]`) || []),
    ];
    return plan.parts.map((part) =>
      candidates.find(
        (element) =>
          element.dataset[identity] === plan.slug &&
          element.dataset[`${prefix}Context`] === end.context &&
          element.dataset[`${prefix}Part`] === part &&
          element.getClientRects().length > 0,
      ),
    );
  };
  const mark = (plan, end, until) => {
    const targets = elements(plan, end);
    if (targets.some((element) => !element)) return false;
    const styles = targets.map((element, index) => [element, `${plan.kind}-${plan.parts[index]}`]);
    styles.push([document.documentElement, 'none']);
    const previous = styles.map(([element]) => element.style.viewTransitionName);
    styles.forEach(([element, name]) => {
      element.style.viewTransitionName = name;
    });
    let cleaned = false;
    cleanup = () => {
      if (cleaned) return;
      cleaned = true;
      styles.forEach(([element], index) => {
        element.style.viewTransitionName = previous[index];
      });
    };
    // An older transition's promise must not clear names applied by a newer one.
    Promise.resolve(until).then(cleanup, cleanup);
    return true;
  };

  document.addEventListener('click', (event) => {
    clickedLink = null;
    const anchor = event.target instanceof Element ? event.target.closest('a[href]') : null;
    if (
      !anchor ||
      event.defaultPrevented ||
      event.button !== 0 ||
      event.metaKey ||
      event.ctrlKey ||
      event.shiftKey ||
      event.altKey ||
      anchor.hasAttribute('download') ||
      (anchor.target && anchor.target !== '_self')
    )
      return;
    const to = localURL(anchor.href);
    if (!to || (to.pathname === location.pathname && to.search === location.search)) return;
    clickedLink = { anchor, event, to: to.href };
  });

  window.addEventListener('pageswap', (event) => {
    cleanup();
    clearPending();
    const clicked = clickedLink;
    const navigationEvent = navigating;
    clickedLink = null;
    navigating = null;
    if (!event.viewTransition) return;
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
      event.viewTransition.skipTransition();
      return;
    }
    const activation = event.activation;
    const toURL = localURL(
      activation?.entry?.url ||
        navigationEvent?.destination?.url ||
        (!clicked?.event.defaultPrevented && clicked?.to),
    );
    if (!toURL) return;
    const from = {
      url: location.href,
      key: activation?.from?.key || navigation()?.currentEntry?.key || null,
    };
    const navigationType = activation?.navigationType || navigationEvent?.navigationType;
    // WebKit can also expose a provisional pageswap key during traversal. The
    // navigate event identifies the real history entry before either snapshot.
    const destination =
      navigationEvent?.destination?.url === toURL.href
        ? navigationEvent.destination
        : activation?.entry;
    const to = {
      url: toURL.href,
      key: navigationType === 'traverse' && destination?.index >= 0 ? destination.key : null,
    };
    const anchor =
      navigationType !== 'traverse' && !clicked?.event.defaultPrevented && clicked?.to === to.url
        ? clicked.anchor
        : null;
    const saved = navigationType === 'traverse' ? recalled(from, to) : null;
    const plan = saved || route(from, to, anchor);
    if (!plan) return; // Other site pages retain the native page crossfade.
    plan.version = 1;
    if (!saved && plan.kind === 'work' && plan.from.context === 'card') {
      plan.from.index = Math.max(0, cards(plan.slug).indexOf(anchor));
    }
    if (!valid(plan) || elements(plan, plan.from).some((element) => !element)) return;
    // If storage is blocked, both documents keep the ordinary page transition.
    if (!write(pendingKey, { ...plan, created: Date.now() })) return;
    mark(plan, plan.from, event.viewTransition.finished);
  });

  window.addEventListener('pagereveal', (event) => {
    cleanup();
    navigating = null;
    const plan = read(pendingKey);
    clearPending(); // Consume even when a timeout or reduced motion skipped the transition.
    const activation = navigation()?.activation;
    if (
      !valid(plan) ||
      plan.to.url !== location.href ||
      typeof plan.created !== 'number' ||
      Date.now() - plan.created < 0 ||
      Date.now() - plan.created > 15000 ||
      (activation?.from &&
        !sameEntry(plan.from, { url: activation.from.url, key: activation.from.key })) ||
      (activation?.entry && plan.to.key && plan.to.key !== activation.entry.key)
    )
      return;
    if (activation?.entry) plan.to.key = activation.entry.key;
    remember(plan);
    if (!event.viewTransition) return;
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
      event.viewTransition.skipTransition();
      return;
    }
    if (!mark(plan, plan.to, event.viewTransition.ready)) event.viewTransition.skipTransition();
  });
})();
</script></head><body><p>This page has moved. <a href="/tempest-web/issues/2026/">Continue to The Tempest.</a></p></body></html>
