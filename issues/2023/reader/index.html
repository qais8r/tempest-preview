</style><!-- This must run in the head before the first render, including on a cold navigation. --><script data-transition-root="/tempest-web/">(() => {

  const pendingKey = `${storageKey}:pending`;
  const historyKey = `${storageKey}:history`;
  const partNames = { work: ['title', 'author'], author: ['portrait', 'name'] };
  let clickedLink = null;
  let navigating = null;
  let cleanup = () => {};
  const navigation = () => Reflect.get(window, 'navigation');

    navigating = event;
  });

    if (typeof value !== 'string') return null;
    try {
      const url = new URL(value, location.href);
      return url.origin === base.origin && url.pathname.startsWith(base.pathname) ? url : null;
    } catch {
      return null;
    }
  };

    const url = localURL(value);
    return url ? `/${url.pathname.slice(base.pathname.length)}` : null;
  };
  const slug = (value, kind) => path(value)?.match(new RegExp(`^/${kind}/([^/]+)/$`))?.[1];
  const isCardPage = (value) =>
    path(value) === '/' || /^\/issues\/\d{4}\/$/.test(path(value)) || !!slug(value, 'authors');

    try {
      return JSON.parse(sessionStorage.getItem(key));
    } catch {
      return null;
    }
  };
  const write = (key, value) => {
    try {
      sessionStorage.setItem(key, JSON.stringify(value));
      return true;
    } catch {
      return false;
    }
  };

    try {
      sessionStorage.removeItem(pendingKey);
    } catch {}
  };

    const contexts =
      plan?.kind === 'work' ? ['card', 'detail'] : ['card', 'profile', 'byline', 'teaser'];
    return (
      plan?.version === 1 &&
      Object.hasOwn(partNames, plan.kind) &&
      typeof plan.slug === 'string' &&
      Array.isArray(plan.parts) &&
      plan.parts.length > 0 &&
      new Set(plan.parts).size === plan.parts.length &&
      plan.parts.every((part) => partNames[plan.kind].includes(part)) &&
      [plan.from, plan.to].every(
        (end) =>
          end &&
          localURL(end.url)?.href === end.url &&
          (end.key === null || typeof end.key === 'string') &&
          contexts.includes(end.context) &&
          Number.isInteger(end.index) &&
          end.index >= 0,
      )
    );

    return Array.isArray(entries) ? entries.filter(valid) : [];

    return null;
  };

    const fromAuthor = slug(from.url, 'authors');
    const toAuthor = slug(to.url, 'authors');
    const fromWork = slug(from.url, 'works');
    const toWork = slug(to.url, 'works');

      (toAuthor && (path(from.url) === '/authors/' || fromWork)) ||
      (fromAuthor && path(to.url) === '/authors/')
    ) {
      return {
        kind: 'author',
        slug: toAuthor || fromAuthor,
        parts:
          anchor?.dataset.authorTransitionParts?.split(' ') ||
          (fromWork ? ['name'] : partNames.author),
        from: {
          ...from,
          context: fromAuthor
            ? 'profile'
            : fromWork
              ? anchor?.dataset.authorTransitionContext || 'byline'
              : 'card',
          index: 0,
        },
        to: { ...to, context: toAuthor ? 'profile' : 'card', index: 0 },
      };

        kind: 'work',
        slug: toWork || fromWork,
        parts: partNames.work,
        from: { ...from, context: fromWork ? 'detail' : 'card', index: 0 },
        to: { ...to, context: toWork ? 'detail' : 'card', index: 0 },
      };

      (element) =>
        element.dataset.workTransition === work && element.dataset.workTransitionContext === 'card',

      plan.kind === 'work' && end.context === 'card' ? cards(plan.slug)[end.index] : document;

      ...(scope?.querySelectorAll(`[data-${plan.kind}-transition-${plan.kind}]`) || []),
    ];

      candidates.find(
        (element) =>
          element.dataset[identity] === plan.slug &&
          element.dataset[`${prefix}Context`] === end.context &&
          element.dataset[`${prefix}Part`] === part &&
          element.getClientRects().length > 0,
      ),
    );
  };

    const targets = elements(plan, end);
    if (targets.some((element) => !element)) return false;

      !anchor ||
      event.defaultPrevented ||
      event.button !== 0 ||
      event.metaKey ||
      event.ctrlKey ||
      event.shiftKey ||
      event.altKey ||

    if (!to || (to.pathname === location.pathname && to.search === location.search)) return;
    clickedLink = { anchor, event, to: to.href };
  });

  window.addEventListener('pageswap', (event) => {
    cleanup();
    clearPending();
    const clicked = clickedLink;
    const navigationEvent = navigating;
    clickedLink = null;
    navigating = null;
    if (!event.viewTransition) return;
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
      event.viewTransition.skipTransition();
      return;
    }

    const toURL = localURL(
      activation?.entry?.url ||
        navigationEvent?.destination?.url ||
        (!clicked?.event.defaultPrevented && clicked?.to),
    );

      url: location.href,
      key: activation?.from?.key || navigation()?.currentEntry?.key || null,
    };

      navigationEvent?.destination?.url === toURL.href

        : activation?.entry;
    const to = {
      url: toURL.href,
      key: navigationType === 'traverse' && destination?.index >= 0 ? destination.key : null,

      navigationType !== 'traverse' && !clicked?.event.defaultPrevented && clicked?.to === to.url

        : null;

    cleanup();
    navigating = null;
    const plan = read(pendingKey);
    clearPending(); // Consume even when a timeout or reduced motion skipped the transition.
    const activation = navigation()?.activation;

      !valid(plan) ||
      plan.to.url !== location.href ||
      typeof plan.created !== 'number' ||
      Date.now() - plan.created < 0 ||
      Date.now() - plan.created > 15000 ||
      (activation?.from &&
        !sameEntry(plan.from, { url: activation.from.url, key: activation.from.key })) ||
      (activation?.entry && plan.to.key && plan.to.key !== activation.entry.key)
    )
      return;
    if (activation?.entry) plan.to.key = activation.entry.key;
    remember(plan);
    if (!event.viewTransition) return;
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
      event.viewTransition.skipTransition();
      return;
    }
    if (!mark(plan, plan.to, event.viewTransition.ready)) event.viewTransition.skipTransition();
  });
})();
