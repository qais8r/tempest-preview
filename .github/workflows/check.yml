name: Check website
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Cache public fixture covers
        uses: actions/cache@v4
        with:
          path: .cache/covers
          key: public-covers-${{ runner.os }}-${{ hashFiles('scripts/prepare.mjs', 'scripts/images.mjs', 'package-lock.json') }}-${{ hashFiles('content/media/**/*.pdf') }}
          restore-keys: |
            public-covers-${{ runner.os }}-${{ hashFiles('scripts/prepare.mjs', 'scripts/images.mjs', 'package-lock.json') }}-
      - run: npx playwright install --with-deps chromium webkit
      - run: npm test
      - run: npm run build
        env:
          BASE_PATH: /tempest-web
      - run: npm run check
      - name: Check production excludes test drafts
        run: |
          test ! -d dist/works/anatomy-of-quiet
          test ! -f dist/media/audio/sample-reading.mp3
          test ! -d dist/media/thumbnails
          test ! -f dist/media/images/sample-light.jpg
          test -f dist/media/pdfs/2026.pdf
